name: News bot

# @fflensapp: posts fantasy impact of injury-status changes, waiver spikes and two weekly roundups (newsbot.py).
# GitHub's cron runs small repos only every few hours, so each run stays up ~5.5 hours checking every 5 minutes,
# then starts the next run itself. The cron below is only a backstop in case the chain ever breaks.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      check:
        description: "Only verify the X credentials (no post)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: newsbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore last run's state
        uses: actions/cache/restore@v4
        with:
          path: newsbot-state.json
          key: newsbot-${{ github.run_id }}
          restore-keys: newsbot-
      - name: Check Sleeper and post (every 5 minutes for ~5.5 hours)
        run: python3 -u newsbot.py ${{ inputs.check && '--check' || '--loop 330' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: newsbot-state.json
          key: newsbot-${{ github.run_id }}
      - name: Start the next run
        if: ${{ !inputs.check && !cancelled() }}
        run: gh workflow run newsbot.yml -R "${{ github.repository }}" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
