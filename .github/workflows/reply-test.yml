name: Reply renderer test
# manual check that the playoff-odds reply image renders on the runner (no posting)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow==12.0.0 playwright==1.64.1
      - run: python3 replies.py EasyMoneyA && ls -la reply-test.png
